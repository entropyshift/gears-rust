name: Set up sccache
description: >-
  Install sccache, start its server and set RUSTC_WRAPPER. The cache is
  S3-compatible storage if it is set up, else the GitHub Actions cache. If
  neither works, builds use plain rustc. Never fails the job. Only runs on
  main write to the cache. Other runs only read it.

# Setup steps: docs/TESTING.md, section 7.4.
# PR code can read any key its job has, so PRs get only the read-only key.
inputs:
  s3-endpoint:
    description: S3-compatible endpoint URL. Empty for AWS S3
    required: false
    default: ""
  s3-region:
    description: S3 region. Default is us-east-1
    required: false
    default: ""
  s3-bucket:
    description: S3 bucket name. Empty means use the GitHub Actions cache
    required: false
    default: ""
  s3-access-key-id:
    description: S3 access key id
    required: false
    default: ""
  s3-secret-access-key:
    description: S3 secret access key
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Pinned, so the install does not call the GitHub releases API on every
      # job. Dependabot does not track it, so bump it by hand.
      with:
        version: v0.18.0

    # Linux with S3 only. Some S3 servers close each connection, so every
    # cache read opens a new one. Behind the runners' shared NAT, some of them
    # reuse a port the server still remembers. If the TCP timestamp looks old,
    # the server ignores the connect and the read stalls. See docs/TESTING.md.
    - name: Turn off TCP timestamps to avoid S3 stalls
      if: runner.os == 'Linux' && inputs.s3-bucket != '' && inputs.s3-access-key-id != ''
      shell: bash
      run: sudo sysctl -q -w net.ipv4.tcp_timestamps=0 || echo "::warning::could not turn off TCP timestamps"

    # Try S3, then the GitHub Actions cache, then plain rustc. The keys stay
    # in this step. Later steps only talk to the running server.
    # Idle timeout 0 keeps the server up during long test runs. Otherwise the
    # next compile starts a new server without these settings.
    - name: Start sccache and set RUSTC_WRAPPER
      shell: bash
      env:
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
        SCCACHE_IDLE_TIMEOUT: "0"
      run: |
        log="$RUNNER_TEMP/sccache-start.log"
        start() {
          if sccache --start-server > "$log" 2>&1; then
            return 0
          fi
          echo "sccache did not start with the $1 backend. Output:"
          cat "$log" || true
          sccache --stop-server > /dev/null 2>&1 || true
          return 1
        }

        # Empty endpoint means AWS S3.
        start_s3() {
          local rc=0
          if [[ -n "$S3_ENDPOINT" ]]; then export SCCACHE_ENDPOINT="$S3_ENDPOINT"; fi
          SCCACHE_REGION="${S3_REGION:-us-east-1}" \
            SCCACHE_BUCKET="$S3_BUCKET" \
            SCCACHE_S3_KEY_PREFIX=gears-rust/sccache/ \
            SCCACHE_S3_RW_MODE="$RW_MODE" \
            AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            start s3 || rc=$?
          unset SCCACHE_ENDPOINT
          return "$rc"
        }

        if [[ -n "$S3_BUCKET" && -n "$S3_ACCESS_KEY_ID" && -n "$S3_SECRET_ACCESS_KEY" ]] && start_s3; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "::notice::sccache backend: S3 storage (${S3_ENDPOINT:-AWS S3}), $RW_MODE"
        else
          # The GitHub cache server does not need the S3 keys.
          unset S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
          if SCCACHE_GHA_ENABLED=true SCCACHE_GHA_RW_MODE="$RW_MODE" start gha; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_GHA_ENABLED=true"
              echo "SCCACHE_GHA_RW_MODE=$RW_MODE"
            } >> "$GITHUB_ENV"
            echo "::notice::sccache backend: GitHub Actions cache, $RW_MODE"
          else
            echo "::warning::sccache did not start, building with plain rustc"
          fi
        fi
