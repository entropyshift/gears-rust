name: Install pinned cargo-gears
description: >-
  Put a prebuilt cargo-gears binary in ~/.cargo/bin for `make install-tools`,
  building it from source only on a miss. Stored in the configured
  S3-compatible storage, or else in the GitHub Actions cache.

# Takes the same storage inputs as sccache-probe (the `&cache-storage` YAML
# anchor in each workflow); see that action for the repository settings.
# The version comes from the workflow's GEARS_CLI_VERSION.
inputs:
  version:
    description: cargo-gears version; defaults to the GEARS_CLI_VERSION env var
    required: false
    default: ""
  s3-endpoint:
    description: S3-compatible endpoint URL; empty for AWS S3
    required: false
    default: ""
  s3-region:
    description: S3 region; defaults to us-east-1
    required: false
    default: ""
  s3-bucket:
    description: S3 bucket name
    required: false
    default: ""
  s3-access-key-id:
    description: S3 access key id
    required: false
    default: ""
  s3-secret-access-key:
    description: S3 secret access key
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Runs before the sccache probe on purpose: the rare source build uses
    # plain rustc rather than pushing release-profile objects of a tool build,
    # which no other job can reuse, into the shared sccache namespace.
    - name: Select cargo-gears storage
      id: pick
      shell: bash
      env:
        VERSION: ${{ inputs.version || env.GEARS_CLI_VERSION }}
        S3_READY: ${{ inputs.s3-bucket != '' && inputs.s3-access-key-id != '' && inputs.s3-secret-access-key != '' }}
      run: |
        if [[ -z "$VERSION" ]]; then
          echo "::error::no cargo-gears version: pass \`version\` or set GEARS_CLI_VERSION"
          exit 1
        fi
        echo "kind=$([[ "$S3_READY" == "true" ]] && echo s3 || echo gha)" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # S3 path. The object is
    # `gears-rust/tools/cargo-gears/<version>/<OS>/cargo-gears[.exe]`, so a
    # version bump is a new object. The upload runs only after a successful
    # install (set -e), and an S3 PUT is atomic, so a cancelled job cannot
    # leave a partial binary under the key. Jobs that miss at the same time
    # all upload the same build; the last write wins, harmlessly.
    - name: cargo-gears via S3 storage
      if: steps.pick.outputs.kind == 's3'
      shell: bash
      env:
        GEARS_VERSION: ${{ steps.pick.outputs.version }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        AWS_DEFAULT_REGION: ${{ inputs.s3-region || 'us-east-1' }}
        # Newer AWS CLI releases send checksum headers by default that some
        # S3-compatible servers (R2 among them) do not fully support; only
        # send them when an operation requires it.
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        set -euo pipefail
        exe=""
        bin_dir="$HOME/.cargo/bin"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          exe=".exe"
          # aws.exe is a native Windows program: hand it a Windows path and
          # keep MSYS from rewriting the s3:// URL.
          bin_dir="$(cygpath -w "$bin_dir")"
          export MSYS_NO_PATHCONV=1
        fi
        endpoint_arg=()
        if [[ -n "$S3_ENDPOINT" ]]; then
          endpoint_arg=(--endpoint-url "$S3_ENDPOINT")
          # Custom endpoints (R2, MinIO, ...) get path-style addressing, which
          # they all support and self-hosted servers usually need; sccache
          # uses it too. AWS S3 keeps the CLI default.
          export AWS_CONFIG_FILE="$RUNNER_TEMP/aws-config"
          printf '[default]\ns3 =\n    addressing_style = path\n' > "$AWS_CONFIG_FILE"
        fi
        mkdir -p "$HOME/.cargo/bin"
        local_bin="$bin_dir/cargo-gears$exe"
        remote="s3://$S3_BUCKET/gears-rust/tools/cargo-gears/$GEARS_VERSION/$RUNNER_OS/cargo-gears$exe"
        # `${a[@]+"${a[@]}"}`: an empty array under `set -u` on any bash.
        s3() { aws s3 cp ${endpoint_arg[@]+"${endpoint_arg[@]}"} --only-show-errors "$@"; }

        if s3 "$remote" "$local_bin"; then
          chmod +x "$HOME/.cargo/bin/cargo-gears$exe"
          echo "::notice::cargo-gears $GEARS_VERSION restored from S3 storage"
        else
          echo "cargo-gears $GEARS_VERSION not in S3 storage yet; building from source"
          cargo install --locked "cargo-gears@$GEARS_VERSION"
          s3 "$local_bin" "$remote" \
            || echo "::warning::could not upload cargo-gears to S3 storage"
        fi
        "$HOME/.cargo/bin/cargo-gears$exe" --version || true

    # GitHub Actions cache path, for runs without the S3 secrets (PRs from
    # forks). Restore-only on pull_request. The key is immutable, so the save
    # sits directly after the install and keeps the default success() guard:
    # a failed or cancelled install never lands under it.
    - name: Restore cargo-gears
      id: gha-restore
      if: steps.pick.outputs.kind == 'gha'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/bin/cargo-gears
          ~/.cargo/bin/cargo-gears.exe
        key: cargo-gears-bin-${{ steps.pick.outputs.version }}-${{ runner.os }}

    - name: Install cargo-gears
      if: steps.pick.outputs.kind == 'gha' && steps.gha-restore.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked "cargo-gears@${{ steps.pick.outputs.version }}"

    - name: Save cargo-gears
      if: steps.pick.outputs.kind == 'gha' && steps.gha-restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/bin/cargo-gears
          ~/.cargo/bin/cargo-gears.exe
        key: cargo-gears-bin-${{ steps.pick.outputs.version }}-${{ runner.os }}
