name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# NOTE: workflow-level paths-ignore above still skips the entire workflow for
# pure doc/markdown changes.  The per-job path filters below provide finer
# granularity so that, e.g., a docs-adjacent config change skips FIPS/tests.

# Concurrency strategy:
# - On pull_request: group by PR number. New commits cancel the in-flight run.
# - On push (main/develop): include run_id so pushes never cancel each other,
#   preventing required CI from silently being dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # We do NOT set RUSTC_WRAPPER globally; we'll enable it per-job after probing sccache.
  # RUSTC_WRAPPER: sccache
  # Size of sccache's local-disk layer (the fallback when the GHA backend is
  # unavailable). 2G measurably thrashed within single jobs; 8G fits runners.
  SCCACHE_CACHE_SIZE: "8G"
  # Usually better determinism and smaller cache churn in CI.
  CARGO_INCREMENTAL: "0"
  # Pinned nightly toolchain used by the coverage job (kept in sync with
  # .github/workflows/shear-expand.yml).
  RUSTUP_TOOLCHAIN_NIGHTLY: nightly-2026-04-16

jobs:
  # ── Change detection ──────────────────────────────────────────────────
  # Lightweight first job that classifies which areas of the repo changed.
  # Downstream jobs use these outputs to skip work that can't be affected.
  # On workflow_dispatch every filter defaults to true (run everything).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust:   ${{ steps.filter.outputs.rust }}
      fips:   ${{ steps.filter.outputs.fips }}
      deps:   ${{ steps.filter.outputs.deps }}
      ci:     ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              # Architecture-lint configuration (cargo gears lint reads it).
              - 'Gears.toml'
            fips:
              - 'libs/toolkit/**'
              - 'libs/toolkit-http/**'
              - 'libs/rustls-*/**'
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            ci:
              - '.github/workflows/**'

  # ── Jobs ──────────────────────────────────────────────────────────────

  # Fast clippy: ubuntu only, 2-pass strategy (~5-6 min vs 30-40 min before).
  # Linting output is platform-independent; platform-specific paths (fips) are
  # covered by the test-fips job. Full feature matrix runs nightly (clippy-nightly.yml).
  clippy:
    name: Clippy
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-hack

      # Restore the shared Cargo registry snapshot (crate sources + git DB;
      # compiled objects live in sccache, not here). One explicit key per OS
      # and lockfile, shared by every job: registry contents are derived from
      # Cargo.lock alone, so the previous per-job/per-toolchain key suffixes
      # only multiplied near-identical ~187 MB snapshots (9 lineages per
      # scope) into the 10 GB quota. Explicit actions/cache keys instead of
      # rust-cache: rust-cache hashes CARGO_*/RUST* env vars into its key, and
      # RUSTFLAGS differs per job (lld-link, coverage cfg), which would split
      # the lineage again silently. PR runs are restore-only; cache-warm.yml
      # is the single writer and seeds the base-branch scope PRs read from.
      # The key hashes the root Cargo.lock only (must stay in sync with
      # cache-warm.yml): tools/fuzz is excluded from the workspace, so its
      # lockfile never affects what `cargo fetch` put in the snapshot.
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      - name: cargo clippy
        run: make clippy

  test:
    name: Test Suite (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    # Above the worst cold-cache Windows leg observed (run-level max 88 min was
    # shear-bound, but the Windows leg has neared 53 min warm); tighten once
    # the sccache warm state is proven.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      # lld-link on Windows: 329 test binaries get linked and links are the
      # one phase sccache can never cache; lld is typically 2-5x faster than
      # link.exe. NOTE: changing RUSTFLAGS changes sccache hashes, so the
      # first Windows run after this change recompiles from cold.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C debuginfo=0 -C linker=lld-link' || '-C debuginfo=0' }}
      # Windows/macOS skip the trybuild/compile-fail suites — serial rustc
      # sessions over identical fixtures with the same pinned toolchain on
      # every OS; the Ubuntu leg keeps full coverage. See .config/nextest.toml.
      NEXTEST_PROFILE: ${{ matrix.os == 'ubuntu-latest' && 'default' || 'no-trybuild' }}
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate gear naming conventions
        run: python3 tools/scripts/validate_gear_names.py

      - name: Validate packaging metadata (readme/license-file paths)
        run: make check-packaging-metadata

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      - name: cargo test (no macros)
        run: make test-no-macros

  integration:
    name: Integration tests
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      - name: UI tests for toolkit macros libraries
        run: make test-macros

      - name: Test users_info with Postgres (integration)
        run: make test-users-info-pg

      - name: Test timescaledb usage-collector plugin (pg integration)
        run: make test-usage-collector-pg

      - name: Test toolkit-db (sqlite integration)
        run: make test-sqlite

      - name: Test toolkit-db (pg integration)
        run: make test-pg

      - name: Test toolkit-db (mysql integration)
        run: make test-mysql

  test-fips:
    name: FIPS verification (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.fips == 'true'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Go is only required for the aws-lc-fips-sys build on the Linux lane.
      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        if: runner.os == 'Linux'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # The registry snapshot holds crate SOURCES only, so sharing it with
      # non-FIPS jobs cannot mix build artifacts. FIPS/non-FIPS object
      # separation happens inside sccache, which keys objects by the full
      # compile invocation (flags, features, toolchain) — FIPS objects are
      # never served to a non-FIPS build. (The old `-fips` rust-cache key
      # segment predates `cache-targets: false` and separated nothing.)
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      # Linux: aws-lc-fips path via the existing make target
      # (cf-gears-toolkit + cf-gears-toolkit-http, bootstrap + fips).
      - name: FIPS tests (Linux / aws-lc-fips)
        if: runner.os == 'Linux'
        shell: bash
        run: make test-fips

      # macOS: exercise the Apple corecrypto TLS provider path.
      - name: FIPS tests (macOS / corecrypto)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo test -p cf-gears-rustls-corecrypto-provider --features fips
          cargo test -p cf-gears-toolkit-http --features fips

      # Windows: build-verify the CNG provider path. Compile-only is sufficient —
      # runtime FIPS execution depends on host FIPS-mode policy (see ADR 0003).
      - name: FIPS build check (Windows / CNG)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo check --target x86_64-pc-windows-msvc -p cf-gears-toolkit-http --features fips

  cfs:
    name: CFS
    uses: ./.github/workflows/cfs.yml

  security:
    name: Security (cargo-deny & cargo-audit on Ubuntu)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # Install tools via prebuilt binaries for speed.
      - name: Install cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-deny@0.20.2

      # Run deny checks but do not fail CI (as requested).
      - name: cargo deny check
        run: make deny

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}
          components: llvm-tools-preview

      # Override rust-toolchain.toml (which pins stable) for all cargo
      # commands in this job.
      - name: Pin nightly for all cargo commands
        run: echo "RUSTUP_TOOLCHAIN=${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}" >> "$GITHUB_ENV"

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      # Registry contents depend on Cargo.lock, not the compiler, so this
      # nightly job reads the same entry as the stable jobs.
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-llvm-cov, nextest

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      # Generate lcov.info for upload. Customize flags/features as needed.
      - name: Coverage (lcov)
        env:
          RUSTFLAGS: "-C debuginfo=0 --cfg coverage_nightly"
          CARGO_LLVM_COV_TARGET_DIR: llvm-cov-target
          CARGO_LLVM_COV_BUILD_DIR: llvm-cov-build
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      # Upload to Codecov; do not fail CI if Codecov is down/misconfigured.
      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}  # Uncomment if required for private repos

  lint:
    name: Architecture Lints (cargo gears lint)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Single knob for the tool version, the install pin, and the cache key.
      CARGO_GEARS_VERSION: "0.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      # The nightly that cargo-gears 0.0.2's embedded dylint lints target
      # (cf-cli crates/cargo-gears-core build.rs). Without it installed, the
      # cached dylint driver fails its self-check and is rebuilt every run.
      # Revisit on CARGO_GEARS_VERSION bumps.
      - name: Install dylint driver toolchain
        run: rustup toolchain install nightly-2026-01-22 --profile minimal

      # cargo-gears embeds its dylint lint libraries at build time, so the
      # binary (plus the dylint driver it builds on first run) is fully
      # cacheable by version — this skips a ~6.5-minute source build per run.
      # restore/save are split so a FAILING lint run (the fix-the-lint loop is
      # exactly when reruns happen) still saves the freshly built tool.
      # NOTE: entries saved by pull_request runs are scoped to that PR; only
      # same-PR reruns hit until a main-scope run seeds the key (planned C1
      # warm workflow; interim: one workflow_dispatch of CI on main).
      - name: Restore cargo-gears and dylint driver
        id: cache-cargo-gears
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-gears
            ~/.dylint_drivers
          key: cargo-gears-${{ env.CARGO_GEARS_VERSION }}-${{ runner.os }}

      - name: Install cargo-gears
        if: steps.cache-cargo-gears.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-gears@${{ env.CARGO_GEARS_VERSION }}

      - name: Run architecture lints
        run: cargo gears lint --dylint

      - name: Save cargo-gears and dylint driver
        if: always() && steps.cache-cargo-gears.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-gears
            ~/.dylint_drivers
          key: cargo-gears-${{ env.CARGO_GEARS_VERSION }}-${{ runner.os }}

  shear:
    name: Unused Deps (cargo-shear)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only — unused-dep warnings should not block PRs.
    continue-on-error: true
    # PRs run cargo-shear's fast static analysis (seconds, no compilation).
    # The slow, macro-expansion-accurate `--expand` variant runs on a schedule
    # instead (.github/workflows/shear-expand.yml). A dep used only inside
    # macro-generated code that gets false-positived here belongs in
    # `[workspace.metadata.cargo-shear] ignored` in the root Cargo.toml.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-shear
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-shear@1.13.1

      - name: cargo shear (static)
        run: make shear
