name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # PR CI only ever validates the ephemeral refs/pull/N/merge ref, so without
  # this trigger the integrated tip of main is tested nowhere: a semantic
  # conflict between two PRs merged minutes apart is caught by neither PR's run.
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# NOTE: workflow-level paths-ignore above still skips the entire workflow for
# pure doc/markdown changes.  The per-job path filters below provide finer
# granularity so that, e.g., a docs-adjacent config change skips FIPS/tests.

# Concurrency strategy:
# - On pull_request: group by PR number. New commits cancel the in-flight run.
# - On push (main/develop): include run_id so pushes never cancel each other,
#   preventing required CI from silently being dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # We do NOT set RUSTC_WRAPPER globally; we'll enable it per-job after probing sccache.
  # RUSTC_WRAPPER: sccache
  # Size of sccache's local-disk layer (the fallback when the GHA backend is
  # unavailable). 2G measurably thrashed within single jobs; 8G fits runners.
  SCCACHE_CACHE_SIZE: "8G"
  # Usually better determinism and smaller cache churn in CI.
  CARGO_INCREMENTAL: "0"
  # Pinned nightly toolchain used by the coverage job. Independent of the pin in
  # shear-nightly.yml — they happen to match today but need not.
  RUSTUP_TOOLCHAIN_NIGHTLY: nightly-2026-04-16

jobs:
  # ── Change detection ──────────────────────────────────────────────────
  # Lightweight first job that classifies which areas of the repo changed.
  # Downstream jobs use these outputs to skip work that can't be affected.
  # On workflow_dispatch every filter defaults to true (run everything).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust:   ${{ steps.filter.outputs.rust }}
      fips:   ${{ steps.filter.outputs.fips }}
      magika: ${{ steps.filter.outputs.magika }}
      dylint: ${{ steps.filter.outputs.dylint }}
      deps:   ${{ steps.filter.outputs.deps }}
      ci:     ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              # Input to `make check-release-config` in the test job: a config-only
              # edit must still get the release configuration validated.
              - 'release-plz.toml'
              # Input to `e2e_sidecar_pins_the_same_timescaledb_image` in
              # libs/test-containers: a Python-only edit to the E2E sidecar must
              # still get the cross-lane TimescaleDB pin checked, or the guard
              # silently never runs on exactly the diff it exists to catch.
              - 'testing/e2e/lib/sidecars.py'
              # Architecture-lint configuration (cargo gears lint reads it).
              - 'Gears.toml'
            fips:
              - 'libs/toolkit/**'
              - 'libs/toolkit-http/**'
              - 'libs/rustls-*/**'
            magika:
              - 'gears/file-parser/**'
            dylint:
              - 'tools/dylint_lints/**'
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            ci:
              - '.github/workflows/**'

  # ── Jobs ──────────────────────────────────────────────────────────────

  # Fast clippy: ubuntu only, 2-pass strategy (~5-6 min vs 30-40 min before).
  # Linting output is platform-independent; platform-specific paths (fips) are
  # covered by the test-fips job. Full feature matrix runs nightly (clippy-nightly.yml).
  clippy:
    name: Clippy
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-hack

      # Restore the shared Cargo registry snapshot (crate sources + git DB;
      # compiled objects live in sccache, not here). One explicit key per OS
      # and lockfile, shared by every job: registry contents are derived from
      # Cargo.lock alone, so the previous per-job/per-toolchain key suffixes
      # only multiplied near-identical ~187 MB snapshots (9 lineages per
      # scope) into the 10 GB quota. Explicit actions/cache keys instead of
      # rust-cache: rust-cache hashes CARGO_*/RUST* env vars into its key, and
      # RUSTFLAGS differs per job (lld-link, coverage cfg), which would split
      # the lineage again silently. PR runs are restore-only; cache-warm.yml
      # is the single writer and seeds the base-branch scope PRs read from.
      # The key hashes the root Cargo.lock only (must stay in sync with
      # cache-warm.yml): tools/fuzz is excluded from the workspace, so its
      # lockfile never affects what `cargo fetch` put in the snapshot.
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      # Database image tags are pinned in libs/test-containers (docs/TESTING.md
      # 4.4). A fixture that constructs a container any other way re-introduces
      # the transitive pin through Cargo.lock that issue #4616 removed: a
      # dependency bump then moves the database under every test with nothing in
      # the diff to show it.
      #
      # This parses the workspace with `syn` rather than grepping it, so import
      # renames, type aliases, non-literal image names and creative formatting
      # cannot slip past. Placed here, after the cache and sccache setup, because
      # it needs a toolchain -- but still ahead of clippy, which is the expensive
      # step in this job.
      - name: No unpinned database container images
        run: cargo xtask check-test-container-pins

      - name: cargo clippy
        run: make clippy

  test:
    name: Test Suite (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    # Above the worst cold-cache Windows leg observed (run-level max 88 min was
    # shear-bound, but the Windows leg has neared 53 min warm); tighten once
    # the sccache warm state is proven.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      # lld-link on Windows: 329 test binaries get linked and links are the
      # one phase sccache can never cache; lld is typically 2-5x faster than
      # link.exe. NOTE: changing RUSTFLAGS changes sccache hashes, so the
      # first Windows run after this change recompiles from cold.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C debuginfo=0 -C linker=lld-link' || '-C debuginfo=0' }}
      # Windows/macOS skip the trybuild/compile-fail suites — serial rustc
      # sessions over identical fixtures with the same pinned toolchain on
      # every OS; the Ubuntu leg keeps full coverage. See .config/nextest.toml.
      NEXTEST_PROFILE: ${{ matrix.os == 'ubuntu-latest' && 'default' || 'no-trybuild' }}
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Validate gear naming conventions
        run: python3 tools/scripts/validate_gear_names.py

      - name: Validate PR-review rule set
        run: python3 tools/scripts/toolkit-pr-review/lint.py

      - name: PR-review agent rules are up to date
        run: python3 tools/scripts/toolkit-pr-review/review.py render-rules --check

      - name: PR-review script tests
        run: python3 -m unittest discover -s tools/scripts/toolkit-pr-review/tests

      - name: Validate packaging metadata (readme/license-file paths)
        run: make check-packaging-metadata

      - name: Validate release configuration (publish flags, release-plz.toml)
        run: make check-release-config

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      - name: cargo test (no macros)
        run: make test-no-macros

      # `bss-fixtures` is the only crate in the tree whose *production* surface
      # is the narrow one: pricing's `FixtureGate` inherits it with
      # `default-features = false`. `default = ["corpus"]`, so the workspace run
      # above compiles the wide build, where `tests/production_surface.rs`'s
      # assertions hold trivially and prove nothing they were written for.
      - name: cargo test (bss-fixtures narrow production surface)
        run: make test-fixtures-narrow

  integration:
    name: Integration tests
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      - name: UI tests for toolkit macros libraries
        run: make test-macros

      - name: Test users_info with Postgres (integration)
        run: make test-users-info-pg

      - name: Test timescaledb usage-collector plugin (pg integration)
        run: make test-usage-collector-pg

      - name: Test postgres-cluster-plugin (pg integration)
        run: make test-cluster-pg

      - name: Test k8s-cluster-plugin (k3s L2+L3 integration)
        # k3s runs in a **privileged** container (testcontainers-modules sets it);
        # GitHub-hosted ubuntu runners permit that. The target uses `cargo test`, not
        # nextest, so one k3s container is shared per test binary -- see the Makefile.
        run: make test-cluster-k8s

      - name: Test resource-group (pg smoke, integration)
        # Fail if Docker is unreachable instead of letting the suite skip itself
        # into a green step that asserted nothing.
        env:
          RG_PG_REQUIRE_DOCKER: "1"
        run: make test-rg-pg

      # bss-pricing's Postgres tests are `#[ignore]`d behind Docker and ran in
      # no job until 2026-08-11 — every concurrency and trigger proof the crate
      # owns lives in them. This job already has Docker. The target passes
      # `--no-fail-fast`; see the Makefile for what the default cost on 2026-08-18.
      - name: Test bss-pricing with Postgres (integration)
        run: make test-pricing-pg

      # coord's `m0001_…` writes two independent SQL literals and only the
      # SQLite one is reachable from the in-crate tests — so the `IF NOT EXISTS`
      # that stops the `bss-pricing`-beside-`bss-ledger` boot crash, and the
      # `in_schema("bss")` form both gears actually pass, ran in no job.
      - name: Test coord with Postgres (integration)
        run: make test-coord-pg

      - name: Test redis-cluster-plugin (redis integration)
        run: make test-cluster-redis

      - name: Test toolkit-db (sqlite integration)
        run: make test-sqlite

      - name: Test toolkit-db (pg integration)
        run: make test-pg

      - name: Test toolkit-db (pgq unit + PG19 integration)
        # Compiles and runs everything behind the `pgq` feature — the secure
        # graph builder, its unit suites and the trybuild guards — and the
        # PostgreSQL 19 integration suite. Locally that suite skips itself while
        # the pre-GA PG19 image is unavailable; here the skip is a failure, so
        # the isolation suite cannot pass green and empty (see
        # libs/test-containers::graph_lane_required).
        env:
          GEARS_TEST_PG_GRAPH_REQUIRED: "1"
        run: make test-pgq

      - name: Test toolkit-db (mysql integration)
        run: make test-mysql

  test-fips:
    name: FIPS verification (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.fips == 'true'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      RUSTFLAGS: "-C debuginfo=0"
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      # Go is only required for the aws-lc-fips-sys build on the Linux lane.
      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # cargo-deny is included so `make install-tools` (invoked by the test
      # targets) finds a new-enough binary and skips its ~2-4 min source build.
      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest,cargo-deny@0.20.2

      # The registry snapshot holds crate SOURCES only, so sharing it with
      # non-FIPS jobs cannot mix build artifacts. FIPS/non-FIPS object
      # separation happens inside sccache, which keys objects by the full
      # compile invocation (flags, features, toolchain) — FIPS objects are
      # never served to a non-FIPS build. The `-fips` segment on the previous
      # rust-cache key separated nothing security-relevant: that key ran with
      # `cache-bin: false` + `cache-targets: false`, so it covered only crate
      # sources, which are byte-identical between FIPS and non-FIPS builds.
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      # Linux: aws-lc-fips path via the existing make target
      # (cf-gears-toolkit + cf-gears-toolkit-http, bootstrap + fips).
      - name: FIPS tests (Linux / aws-lc-fips)
        if: runner.os == 'Linux'
        shell: bash
        run: make test-fips

      # macOS: exercise the Apple corecrypto TLS provider path.
      - name: FIPS tests (macOS / corecrypto)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo test -p cf-gears-rustls-corecrypto-provider --features fips
          cargo test -p cf-gears-toolkit-http --features fips

      # Windows: build-verify the CNG provider path. Compile-only is sufficient —
      # runtime FIPS execution depends on host FIPS-mode policy (see ADR 0003).
      - name: FIPS build check (Windows / CNG)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo check --target x86_64-pc-windows-msvc -p cf-gears-toolkit-http --features fips

  # Builds and tests file-parser's optional `magika` feature so it doesn't
  # silently rot. `ort`'s own `download-binaries` feature is NOT used here —
  # it always links statically, which conflicts with `load-dynamic` (baked
  # into the workspace `ort` dependency for production) and reliably
  # deadlocks `ort` 2.0.0-rc.12 (confirmed via stack sampling: its
  # error-reporting path for a failed/incompatible runtime recursively
  # re-enters the same `OnceLock` it's initializing, blocking the thread
  # forever instead of returning an error). Instead, this job downloads a
  # real ONNX Runtime shared library and points `ORT_DYLIB_PATH` at it —
  # exactly the mechanism production uses. `timeout-minutes` on the test step
  # is a backstop in case a future regression reintroduces that hang.
  test-magika:
    name: Magika feature verification
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.magika == 'true'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # api-24 (see workspace Cargo.toml `ort` entry) requires an ONNX
      # Runtime with minor version >= 24; older builds fail `ort`'s version
      # check on load. Bump alongside `ort`'s pinned version.
      ONNXRUNTIME_VERSION: "1.29.0"
      # sha256 of onnxruntime-linux-x64-1.29.0.tgz. Recompute and bump
      # alongside ONNXRUNTIME_VERSION.
      ONNXRUNTIME_SHA256: "c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-magika

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: Fetch ONNX Runtime shared library
        shell: bash
        run: |
          set -euo pipefail
          curl -sL --fail -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          echo "${ONNXRUNTIME_SHA256}  /tmp/onnxruntime.tgz" | sha256sum --check
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: cargo test (file-parser, magika feature)
        shell: bash
        timeout-minutes: 10
        run: cargo test -p cf-gears-file-parser --features magika

      - name: Install cargo-deny
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check (magika feature)
        run: make deny-magika

  cfs:
    name: CFS
    uses: ./.github/workflows/cfs.yml

  security:
    name: Security (cargo-deny on Ubuntu)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # Install tools via prebuilt binaries for speed.
      - name: Install cargo-deny
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-deny@0.20.2

      # Blocking gate: advisories, licenses, bans and sources.
      - name: cargo deny check
        run: make deny

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # Must exist BEFORE the probe step's `sccache --start-server` — the
      # server binds its storage backend (GHA cache vs local disk) at startup.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}
          components: llvm-tools-preview

      # Override rust-toolchain.toml (which pins stable) for all cargo
      # commands in this job.
      - name: Pin nightly for all cargo commands
        run: echo "RUSTUP_TOOLCHAIN=${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}" >> "$GITHUB_ENV"

      # Shared registry snapshot; restore-only (single writer: cache-warm.yml).
      # Registry contents depend on Cargo.lock, not the compiler, so this
      # nightly job reads the same entry as the stable jobs.
      - name: Restore Cargo registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          # SCCACHE_GHA_ENABLED is set as job-level env, so the server starts
          # on the GHA cache backend (the backend is fixed at server startup —
          # setting it after `--start-server` would silently leave the server
          # on a per-runner local-disk cache). On probe failure: plain rustc.
          if sccache --start-server > /tmp/sccache-start.log 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc; startup output:"
            cat /tmp/sccache-start.log || true
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-llvm-cov, nextest

      # free-disk-space cleanup was removed (runners start with ~88 GB free);
      # this guard keeps disk headroom visible in logs in case that changes.
      - name: Disk headroom (guard)
        shell: bash
        run: df -h .

      # Generate lcov.info for upload. Customize flags/features as needed.
      #
      # Two instrumented passes are accumulated (`--no-report`) into one target
      # dir and merged into a single lcov.info at the end (`report`):
      #
      #   1. `nextest --workspace` — the whole workspace at default features.
      #   2. The redis-cluster-plugin integration suites. These live behind
      #      `required-features = ["integration"]`.
      #   3. The k8s-cluster-plugin L2/L3 k3s suites. These live behind
      #      `required-features = ["integration"]`.
      #
      # The per-binary k3s loop (one container per binary, cleaned between —
      # nextest's process-per-test would start ~70 of them) lives in the
      # `coverage-cluster-k8s` Makefile target so this step stays readable; it
      # inherits this step's CARGO_LLVM_COV_* env and accumulates into the same
      # session. Keep it in sync with `test-cluster-k8s`.
      - name: Coverage (lcov)
        env:
          RUSTFLAGS: "-C debuginfo=0 --cfg coverage_nightly"
          CARGO_LLVM_COV_TARGET_DIR: llvm-cov-target
          CARGO_LLVM_COV_BUILD_DIR: llvm-cov-build
        run: |
          cargo llvm-cov clean --workspace
          # Pass 1: whole workspace, default features. Accumulate, don't report.
          cargo llvm-cov nextest --workspace --no-report
          # Pass 2: redis-cluster-plugin integration suites (real Redis via
          # testcontainers).
          cargo llvm-cov nextest --no-report -p cf-redis-cluster-plugin --features integration --retries 1
          # Pass 3: k8s-cluster-plugin k3s suites
          make coverage-cluster-k8s
          # Merge into the single report that gets uploaded.
          cargo llvm-cov report --lcov --output-path lcov.info

      # Upload LCOV report as a GitHub Actions artifact so it is always
      # available, even when Codecov is unavailable or rejects the upload.
      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

      # Upload to Codecov. OIDC is used for non-fork events (push, dispatch);
      # for fork PRs the action auto-detects the fork and falls back to
      # tokenless upload (GitHub does not grant id-token:write for forks).
      # fail_ci_if_error is true for non-fork events so upload failures are
      # visible; for fork PRs it is best-effort (tokenless can be rate-limited).
      # disable_search prevents auto-discovery of unrelated files (e.g.
      # coverage_guard.rs) — only lcov.info is sent.
      - name: Upload to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: ${{ github.event_name != 'pull_request' }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  lint:
    name: Architecture Lints (cargo gears lint)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Single knob for the tool version, the install pin, and the cache key.
      CARGO_GEARS_VERSION: "0.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      # The nightly that cargo-gears 0.0.2's embedded dylint lints target
      # (cf-cli crates/cargo-gears-core build.rs). Without it installed, the
      # cached dylint driver fails its self-check and is rebuilt every run.
      # Revisit on CARGO_GEARS_VERSION bumps.
      - name: Install dylint driver toolchain
        run: rustup toolchain install nightly-2026-01-22 --profile minimal

      # cargo-gears embeds its dylint lint libraries at build time, so the
      # binary (plus the dylint driver it builds on first run) is fully
      # cacheable by version — this skips a ~6.5-minute source build per run.
      # restore/save are split so a FAILING lint run (the fix-the-lint loop is
      # exactly when reruns happen) still saves the freshly built tool.
      # NOTE: entries saved by pull_request runs are scoped to that PR; only
      # same-PR reruns hit until a main-scope run seeds the key (planned C1
      # warm workflow; interim: one workflow_dispatch of CI on main).
      - name: Restore cargo-gears and dylint driver
        id: cache-cargo-gears
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-gears
            ~/.dylint_drivers
          key: cargo-gears-${{ env.CARGO_GEARS_VERSION }}-${{ runner.os }}

      - name: Install cargo-gears
        if: steps.cache-cargo-gears.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-gears@${{ env.CARGO_GEARS_VERSION }}

      - name: Run architecture lints
        run: cargo gears lint --dylint

      - name: Save cargo-gears and dylint driver
        if: always() && steps.cache-cargo-gears.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-gears
            ~/.dylint_drivers
          key: cargo-gears-${{ env.CARGO_GEARS_VERSION }}-${{ runner.os }}
