# One-off probe: where does the Windows "Build tests (no macros)" step spend
# its time? Same settings as the Test Suite job, plus Cargo's timing report.
name: probe windows timings

on:
  push:
    branches: [ ci-probe-windows-timings ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: "0"

jobs:
  build-timings:
    name: Build tests with timings (windows, ${{ matrix.variant }} ${{ matrix.sample }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ as-is, dev-drive ]
        sample: [ 1, 2 ]
    environment:
      name: ci-cache-read
      deployment: false
    timeout-minutes: 90
    env:
      RUSTFLAGS: '-C debuginfo=0 -C linker=lld-link -C link-arg=-Brepro -C link-arg=-DEBUG:NONE'
      _LINK_: '-Brepro -DEBUG:NONE'
    steps:
      - name: Force LF in working tree (w/a for Windows)
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Antivirus status
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, IsTamperProtected | Format-List

      - name: Turn off antivirus real-time scanning
        if: matrix.variant == 'defender-off'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | Format-List

      # Mounted at the usual target folder, so paths and sccache keys stay the same.
      - name: Dev Drive for the target folder
        if: matrix.variant == 'dev-drive'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 80GB
          mount-path: ${{ github.workspace }}/target

      - name: Install protoc
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      - name: Restore Cargo registry
        uses: ./.github/actions/cargo-registry

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe sccache & set RUSTC_WRAPPER
        uses: ./.github/actions/sccache-probe
        with:
          s3-endpoint: ${{ vars.S3_ENDPOINT }}
          s3-region: ${{ vars.S3_REGION }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Build tests (no macros) with timings
        shell: bash
        run: |
          nproc || true
          time cargo test --no-run --workspace --exclude cf-gears-toolkit-macros-tests --exclude cf-gears-toolkit-db-macros --timings > "$RUNNER_TEMP/build.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/build.txt"; exit 1; }
          sccache --show-stats
          ls target/cargo-timings

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-timings-${{ matrix.variant }}-${{ matrix.sample }}
          path: |
            target/cargo-timings/
            ${{ runner.temp }}/build.txt

