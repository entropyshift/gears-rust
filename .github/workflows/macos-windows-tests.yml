name: macOS and Windows tests

# Runs the Rust unit tests on macOS and Windows once a day. PRs and pushes to
# main run them on Ubuntu only (ci.yml), because Windows was the slowest PR job
# and OS-specific breaks are rare.
#
# Nobody sees a red nightly run on its own. So a failed scheduled run opens a
# tracking issue, and a passing one closes it. Manual runs skip the issue.
#
# To run it by hand: Actions > macOS and Windows tests > Run workflow.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily, with the clippy and e2e nightlies
  workflow_dispatch:
  # TEST ONLY, not for upstream: run once on this fork branch.
  push:
    branches: [ ci-nightly-macos-windows-test ]

# The event is in the key, so a manual run does not cancel the nightly one.
concurrency:
  group: macos-windows-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Who to @-mention in the issue. Empty means nobody gets pinged.
  ISSUE_MENTION: ''
  # The issue steps find the open issue by this exact title.
  ISSUE_TITLE: 'macOS and Windows tests (nightly) failed'

jobs:
  test:
    # test-report.yml matches on this name plus ` / nextest`.
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    uses: ./.github/workflows/test-suite.yml
    with:
      os: ${{ matrix.os }}

  issue:
    name: Update tracking issue
    needs: test
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read   # to read this run's jobs and reports
      issues: write
    steps:
      # One folder per OS, named after the artifact.
      - name: Download test reports
        if: needs.test.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[].name | select(startswith("rust-tests-"))' |
          while IFS= read -r artifact; do
            gh run download "$RUN_ID" -R "$REPO" -n "$artifact" -D "reports/${artifact#rust-tests-}"
          done
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name | startswith("Test Suite (")) | [.name, (.conclusion // "")] | @tsv' \
            > jobs.tsv

      # These tests often flake on macOS and Windows. Listing the failed tests
      # helps tell a flake from a real break.
      - name: Summarize failures
        if: needs.test.result == 'failure'
        shell: python
        run: |
          import glob, os
          import xml.etree.ElementTree as ET

          MAX = 20
          lines = []
          for row in open("jobs.tsv"):
              job, conclusion = row.rstrip("\n").split("\t")
              lines.append(f"- {job}: **{conclusion or 'unknown'}**")
          lines.append("")
          for report in sorted(glob.glob("reports/*")):
              failed = []
              for path in glob.glob(f"{report}/*.xml"):
                  for case in ET.parse(path).iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          failed.append(f"- `{case.get('name')}` ({case.get('classname', '')})")
              if failed:
                  more = [f"- ...and {len(failed) - MAX} more"] if len(failed) > MAX else []
                  lines += [f"Failed on {os.path.basename(report)}:", ""] + failed[:MAX] + more + [""]
          if not any(l.startswith("Failed on") for l in lines):
              lines.append("No failed tests in the reports, so the build or setup failed. Check the run log.")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "failures.md"), "w") as f:
              f.write("\n".join(lines))

      # Runs even if a step above failed. The issue matters more than the summary.
      - name: Open or update issue on nightly failure
        if: ${{ !cancelled() && needs.test.result == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const title = process.env.ISSUE_TITLE;
            const mention = (process.env.ISSUE_MENTION || '').trim();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let summary = '';
            try {
              summary = fs.readFileSync(`${process.env.RUNNER_TEMP}/failures.md`, 'utf8').trim();
            } catch (e) {
              core.info(`No failure summary: ${e.message}`);
            }

            const lines = [];
            if (mention) lines.push(mention, '');
            lines.push(
              'The macOS and Windows tests failed on `main`.',
              '',
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              '',
              summary || '_No summary. Check the run log._',
              '',
              'If it looks like a flake, click "Re-run failed jobs" on the run.',
              'A passing re-run closes this issue.',
            );
            const body = lines.join('\n');

            // Find the open issue by its exact title. listForRepo also
            // returns PRs, so skip those.
            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const existing = candidates.filter((i) => !i.pull_request && i.title === title);

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing[0].number, body,
              });
              core.info(`Commented on #${existing[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['bug', 'ci'],
              });
              core.info(`Created #${created.data.number}`);
            }

      # Close the issue once the tests pass again.
      - name: Close nightly issue on success
        if: needs.test.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const open = candidates.filter((i) => !i.pull_request && i.title === title);

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Fixed. The macOS and Windows tests passed on ${context.sha}.\n\n- Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
              core.info(`Closed #${issue.number}`);
            }
