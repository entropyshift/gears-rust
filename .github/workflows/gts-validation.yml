name: GTS Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'docs/**'
      - 'guidelines/**'
  workflow_dispatch:

concurrency:
  group: gts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gts_validate:
    name: Validate GTS Identifiers
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the pinned version — used by the cache key
      # and the install command below.
      GTS_VALIDATOR_VERSION: "0.10.1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # The binary depends only on its pinned version, so the key carries
      # nothing else. The previous rust-cache setup (cache-bin + registry
      # snapshot) hashed the workspace Cargo.lock into its key, minting a new
      # ~189 MB entry on every lockfile change (8 duplicates observed in the
      # cache census) even though the binary itself never changed.
      - name: Restore gts-validator binary
        id: gts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/gts-validator
          key: gts-validator-bin-${{ env.GTS_VALIDATOR_VERSION }}-${{ runner.os }}

      - name: Install gts-validator
        if: steps.gts-cache.outputs.cache-hit != 'true'
        # Pinned + --locked for reproducibility; skipped entirely when the
        # cached binary for this exact version was restored.
        run: cargo install gts-validator --version "$GTS_VALIDATOR_VERSION" --locked

      - name: Save gts-validator binary
        if: steps.gts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/gts-validator
          key: gts-validator-bin-${{ env.GTS_VALIDATOR_VERSION }}-${{ runner.os }}

      - name: Validate GTS identifiers
        run: make gts-docs
