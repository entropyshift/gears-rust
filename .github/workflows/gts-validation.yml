name: GTS Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'docs/**'
      - 'guidelines/**'
  # On main too: only a save on main can be restored by every PR.
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'docs/**'
      - 'guidelines/**'
  workflow_dispatch:

concurrency:
  group: gts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Local dev enables incremental compilation via [profile.dev]; CI does not want
  # the extra codegen and disk churn.
  CARGO_INCREMENTAL: "0"

jobs:
  gts_validate:
    name: Validate GTS Identifiers
    runs-on: ubuntu-latest
    env:
      # Used by the cache key and the install.
      GTS_VALIDATOR_VERSION: "0.10.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # Key is the version only. The old rust-cache key used Cargo.lock and
      # made a new ~189 MB entry on every lockfile change.
      - name: Restore gts-validator binary
        id: gts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/gts-validator
          key: gts-validator-bin-${{ env.GTS_VALIDATOR_VERSION }}-${{ runner.os }}

      - name: Install gts-validator
        if: steps.gts-cache.outputs.cache-hit != 'true'
        # Skipped when the cached binary was restored.
        run: cargo install gts-validator --version "$GTS_VALIDATOR_VERSION" --locked

      # Not on pull_request: see the push trigger above.
      - name: Save gts-validator binary
        if: steps.gts-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/gts-validator
          key: gts-validator-bin-${{ env.GTS_VALIDATOR_VERSION }}-${{ runner.os }}

      - name: Validate GTS identifiers
        run: make gts-docs
