name: Release (release-plz)

on:
  push:
    branches:
      - main
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: "Which release-plz command to run"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - release-pr

# Restrict default permissions to read-only
permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'constructorfabric/gears-rust' && (github.event_name == 'push' || github.event.inputs.mode == 'release-pr') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: release-plz release-pr
        uses: release-plz/action@52440b50d383aa252927de395c8b2c1e0a9cf8e9 # v0.3.155
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-caches:
    name: Cleanup PR caches before release
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == 'constructorfabric/gears-rust'
        && (
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
          || (
            github.event_name == 'pull_request'
            && github.event.pull_request.merged == true
            && contains(join(github.event.pull_request.labels.*.name, ','), 'release-plz')
          )
        )
      }}
    permissions:
      actions: write
    steps:
      # Previously this deleted EVERY v0-rust-pr-* cache repo-wide on each
      # release event — with releases (and failing-publish retries) happening
      # daily, PR rust-cache restores missed even between two runs of the SAME
      # PR. Now it only trims least-recently-used entries, and only when the
      # repo is close to GitHub's 10 GB cache quota, so recently used PR
      # caches survive and stay restorable.
      - name: Trim least-recently-used PR rust caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          # Trim down to this total repo usage: leaves ~3 GiB of headroom for
          # the release build's own cache writes before GitHub's 10 GiB LRU
          # eviction would kick in.
          TARGET_BYTES: "7516192768" # 7 GiB
          MAX_DELETE: "500"
        run: |
          set -euo pipefail

          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"

          CACHES=$(gh api --paginate "/repos/$OWNER/$REPO/actions/caches?per_page=100" | jq -s '[.[].actions_caches[]]')
          TOTAL=$(jq 'map(.size_in_bytes) | add // 0' <<<"$CACHES")
          echo "Repo cache usage: $TOTAL bytes (trim target: $TARGET_BYTES)"

          if [ "$TOTAL" -le "$TARGET_BYTES" ]; then
            echo "Under target — nothing to trim."
            exit 0
          fi

          EXCESS=$((TOTAL - TARGET_BYTES))
          DELETED=0
          FREED=0

          # Only PR-scoped rust caches (and the gts-validator lineage, which
          # previously escaped every cleanup path) are eligible; least
          # recently used go first. Pre-computing the list (instead of a
          # process substitution) lets `set -e` catch a jq failure here.
          ELIGIBLE=$(jq -r '
            map(select((.key | startswith("v0-rust-pr-"))
                    or (.key | startswith("v0-rust-gts-validator-"))))
            | sort_by(.last_accessed_at // .created_at)
            | .[] | [.id, (.size_in_bytes // 0), .key] | @tsv' <<<"$CACHES")
          ELIGIBLE_TOTAL=$(jq '
            map(select((.key | startswith("v0-rust-pr-"))
                    or (.key | startswith("v0-rust-gts-validator-"))))
            | map(.size_in_bytes) | add // 0' <<<"$CACHES")

          if [ "$ELIGIBLE_TOTAL" -lt "$EXCESS" ]; then
            echo "WARNING: eligible caches ($ELIGIBLE_TOTAL bytes) cannot cover the" \
                 "excess ($EXCESS bytes) — ineligible lineages (sccache objects," \
                 "main-scope keys, ...) are crowding the quota. Trimming what we can."
          fi

          while IFS=$'\t' read -r id size key; do
            [ -n "$id" ] || continue
            [ "$FREED" -ge "$EXCESS" ] && break
            if [ "$DELETED" -ge "$MAX_DELETE" ]; then
              echo "Reached MAX_DELETE=$MAX_DELETE, stopping."
              break
            fi
            echo "Deleting cache $id ($size bytes): $key"
            if gh api -X DELETE "/repos/$OWNER/$REPO/actions/caches/$id"; then
              FREED=$((FREED+size))
            else
              echo "Delete failed for cache $id (racing eviction?) — not counting it as freed."
            fi
            DELETED=$((DELETED+1))
          done <<<"$ELIGIBLE"

          echo "Processed $DELETED delete(s), freed ~$FREED bytes."

  release:
    name: Publish crates
    needs: cleanup-caches
    runs-on: ubuntu-latest
    # IMPORTANT: don't publish on every push. Publish only:
    # - manually via workflow_dispatch (mode=release), or
    # - when a release PR (labeled `release-plz`) is merged into main.
    if: >-
      ${{
        github.repository == 'constructorfabric/gears-rust'
        && (
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
          || (
            github.event_name == 'pull_request'
            && github.event.pull_request.merged == true
            && contains(join(github.event.pull_request.labels.*.name, ','), 'release-plz')
          )
        )
      }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Disk report (before cleanup)
        run: |
          set -euxo pipefail
          df -h
          du -sh . || true
          du -xh . | sort -h | tail -n 40 || true

      - name: Runner-local cache cleanup
        run: |
          set -euxo pipefail
          rm -rf target || true
          rm -rf ~/.cargo/registry ~/.cargo/git || true
          df -h

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest

      - name: cargo test (workspace)
        run: make test-no-macros

      - name: Clean build artifacts
        run: rm -rf target

      - name: Clear cargo registry index (workaround gix slotmap overflow)
        run: rm -rf ~/.cargo/registry/index

      - name: release-plz release
        uses: release-plz/action@52440b50d383aa252927de395c8b2c1e0a9cf8e9 # v0.3.155
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

      - name: Disk report (post-mortem)
        if: always()
        run: df -h
